name: react-node-task-manager
services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    volumes:
      - tasks-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tasks", "-d", "tasks"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks
      WEB_ORIGIN: http://localhost:5174,http://127.0.0.1:5174
      PORT: 3000
      TASK_DELETE_PASSWORD: ${TASK_DELETE_PASSWORD:-}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ../react-node-task-manager-web
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tasks-data:
